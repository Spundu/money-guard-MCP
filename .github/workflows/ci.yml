name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45 # a 2-CPU Windows runner took 15 min with failures cutting it short (2026-10-18)
    strategy:
      fail-fast: false
      matrix:
        # Windows because path confinement differs there (drive letters, UNC, junctions, case).
        os: [ubuntu-latest, windows-latest]
        node-version: ['22.x', '24.x', '26.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # `npm ci` installs exactly the lockfile and runs the `prepare` hook, which builds dist/.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # npm test, run once more only after Node.js 24's V8 abort (SPEC.md §1 fact 7).
      - name: Test
        run: node scripts/test-ci.mjs

  floor:
    # package.json promises Node >= 22.12; the matrix's 22.x is the newest 22. ESLint 10 itself needs
    # 22.13, so this job typechecks and tests without linting.
    name: Test on the lowest supported Node.js (22.12.0)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 22.12.0
        uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  package:
    name: Package contents and consumer smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # An ALLOWLIST: the built JavaScript, the licence, the README and package.json.
      - name: Verify package contents
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const files = require('./pack.json')[0].files.map((f) => f.path);
            const need = ['dist/index.js', 'dist/server.js', 'dist/lint/worker.js', 'LICENSE', 'README.md', 'package.json'];
            const missing = need.filter((p) => !files.includes(p));
            const allowed = (p) => /^dist\/(?:[a-z]+\/)?[a-z-]+\.js$/.test(p) || ['LICENSE', 'README.md', 'package.json'].includes(p);
            const stray = files.filter((p) => !allowed(p));
            if (missing.length || stray.length) { console.error({ missing, stray }); process.exit(1); }
            console.log(files.length + ' files, all allowed');
          "

      # The tests import src/; this installs the PACKED tarball into an empty project and starts it the
      # way an MCP host does, over stdio.
      - name: Consumer smoke test of the packed tarball
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/money-guard-mcp-*.tgz @modelcontextprotocol/client@2.3.1
          # Copied here, so its imports resolve the packages installed in this project, not the repository's.
          cp "$GITHUB_WORKSPACE/scripts/consumer-smoke.mjs" .
          node consumer-smoke.mjs

  bundle:
    name: Claude Desktop bundle (MCPB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Builds money-guard-mcp-<version>.mcpb with the pinned mcpb CLI, then unpacks it into an empty
      # folder and starts it the way Claude Desktop does, from its manifest (scripts/bundle.mjs).
      - name: Build and test the bundle
        run: npm run bundle

      - name: Keep the bundle
        uses: actions/upload-artifact@v7
        with:
          name: money-guard-mcp-bundle
          path: money-guard-mcp-*.mcpb
          if-no-files-found: error

  inspector:
    name: MCP Inspector (both protocol eras)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inspector smoke test
        run: bash scripts/inspector-smoke.sh

  eval:
    # The eval's cases and grader, without a model or an API key: the case projects are what
    # build_cases.mjs writes, money-guard itself reports exactly their planted problems, and the
    # grader passes a perfect report and fails empty, extra and malformed ones (eval/README.md).
    name: Eval cases and grader (no model)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: The committed cases are what build_cases.mjs writes
        run: |
          node eval/build_cases.mjs
          git diff --exit-code -- eval/cases eval/cases.json
          test -z "$(git status --porcelain -- eval/cases eval/cases.json)"

      - name: money-guard reports exactly the planted problems
        run: node eval/check_cases.mjs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Grader tests
        run: |
          python -m pip install -r eval/requirements.txt
          python -m pytest -q eval
